spring:
    application:
        name: FakeCommerce
    datasource:
        url : ${database_url}
        username: ${username}
        password : ${password}
        driver-class-name: com.mysql.cj.jdbc.Driver
    flyway:
        enabled: true
        locations: classpath:db/migrations
    jpa:
        show-sql: true
        hibernate:
            ddl-auto: validate
    jackson:
        deserialization:
            fail-on-unknown-properties: true


server:
    port: ${server_port_number}